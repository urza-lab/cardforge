name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend-lint-typecheck:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: mypy app

  backend-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: cardforge_test
          POSTGRES_USER: cardforge
          POSTGRES_PASSWORD: test-password
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U cardforge -d cardforge_test"
          --health-interval 10s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 10s --health-timeout 5s --health-retries 10
    env:
      CARDFORGE_POSTGRES_HOST: localhost
      CARDFORGE_POSTGRES_DB: cardforge_test
      CARDFORGE_POSTGRES_USER: cardforge
      CARDFORGE_REDIS_HOST: localhost
      # Must not be 0 - that's what the real worker container listens on in
      # production; tests enqueue real RQ jobs (see backend/tests/conftest.py).
      CARDFORGE_REDIS_DB: "1"
      DB_PASSWORD: test-password
      APP_SECRET_KEY: ci-test-secret-key
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: alembic upgrade head
      - run: pytest --cov=app --cov-report=term-missing

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          # No `cache: npm` here: this repo intentionally ships without a
          # committed package-lock.json yet (see DEVELOPMENT.md) — `npm ci`/
          # setup-node's cache both require one. Once a lockfile is
          # committed, switch to `npm ci` + cache for reproducible/faster CI.
      - run: npm install
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build

  compose-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate docker-compose.yml
        run: docker compose -f docker-compose.yml config -q
      - name: Validate docker-compose.yml + docker-compose.dev.yml
        run: docker compose -f docker-compose.yml -f docker-compose.dev.yml config -q
