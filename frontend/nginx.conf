server {
    listen 80;
    # Also listen on IPv6: the container HEALTHCHECK (see Dockerfile) probes
    # http://localhost/healthz, and /etc/hosts resolves "localhost" to ::1
    # before 127.0.0.1 — an IPv4-only listener made every healthcheck fail
    # with "connection refused" even though the proxy itself worked fine.
    listen [::]:80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Plain-text liveness probe for the container healthcheck / LB.
    location = /healthz {
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # Same-origin API proxy — the frontend and backend share one origin
    # (http://<host>:666), so no CORS configuration is needed in production.
    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # React Router: serve index.html for any non-file, non-API route.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
