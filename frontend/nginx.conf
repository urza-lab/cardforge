server {
    listen 80;
    # Also listen on IPv6: the container HEALTHCHECK (see Dockerfile) probes
    # http://localhost/healthz, and /etc/hosts resolves "localhost" to ::1
    # before 127.0.0.1 — an IPv4-only listener made every healthcheck fail
    # with "connection refused" even though the proxy itself worked fine.
    listen [::]:80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Plain-text liveness probe for the container healthcheck / LB.
    location = /healthz {
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # Same-origin API proxy — the frontend and backend share one origin
    # (http://<host>:666), so no CORS configuration is needed in production.
    location /api/ {
        # A bare `proxy_pass http://backend:8000/...;` resolves "backend"
        # once, at nginx startup, and caches that IP forever — if the
        # backend container is later recreated (a rebuild, `up --build`,
        # anything that gives it a new IP) without also restarting/
        # reloading nginx, every request 502s with "connect() failed
        # (111: Connection refused)" to the old, now-dead IP, even though
        # the (new) backend container is healthy. Using Docker's embedded
        # DNS resolver (127.0.0.11) with a variable target forces nginx to
        # re-resolve "backend" on every request instead of caching it once.
        # A variable in proxy_pass also disables nginx's usual "replace the
        # matched location prefix with the proxy_pass URI" rewriting - with
        # a variable, nginx appends nothing from the request on its own, so
        # $request_uri has to be appended explicitly (confirmed live: without
        # it, every request landed on the backend as a bare "/api/" with the
        # rest of the path silently dropped, surfacing as a wrong redirect).
        # Since this location's prefix ("/api/") is identical to the
        # backend's own route prefix, forwarding the full original URI as-is
        # is exactly correct - no path rewriting is actually needed here.
        resolver 127.0.0.11 valid=10s;
        set $backend_upstream http://backend:8000;
        proxy_pass $backend_upstream$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Same-origin proxy to the optional Grafana container (--profile
    # observability, off by default - see ARCHITECTURE.md) so an embedded
    # Grafana panel (Dashboard page) only ever needs this app's own origin,
    # not a second host:port the browser has to reach separately. Same
    # resolve-per-request pattern as /api/ above - if Grafana isn't running,
    # DNS resolution for "grafana" just fails per-request (502 for that
    # request only), it doesn't block anything else in this config.
    # GF_SERVER_ROOT_URL/GF_SERVER_SERVE_FROM_SUB_PATH on the grafana
    # service (docker-compose.yml) must both point at this same "/grafana/"
    # prefix - see CLAUDE.md gotcha #24 for what happens when they drift.
    location /grafana/ {
        resolver 127.0.0.11 valid=10s;
        set $grafana_upstream http://grafana:3000;
        proxy_pass $grafana_upstream$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        # Grafana's live-updating panels use WebSockets.
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # React Router: serve index.html for any non-file, non-API route.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
