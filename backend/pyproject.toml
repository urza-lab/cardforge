[project]
name = "cardforge-backend"
version = "0.1.0"
description = "CardForge — Deck & Cube Finder backend"
requires-python = ">=3.12"

[tool.ruff]
line-length = 110
target-version = "py312"
src = ["app", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

# FastAPI's own dependency-injection pattern (`db: Session = Depends(get_db)`)
# is a function call in an argument default, which B008 normally flags as a
# mutable-default footgun - it isn't one here (FastAPI calls it fresh per
# request, never reuses a cached default). This is B008's own documented
# exception mechanism, not a suppression of a real issue.
[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Path", "fastapi.Body", "fastapi.File", "fastapi.Form"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
disallow_untyped_defs = false
warn_unused_ignores = true
exclude = ["tests/"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
